name: KAYA catalog sync

# Refreshes gym_catalog from KAYA for every gym registered in catalog_gyms. Runs
# in Actions rather than the Worker because the pull needs a headless browser,
# which Workers can't run. The repository_dispatch trigger is what the app fires
# when you add a gym, so its catalog arrives in minutes instead of tomorrow.
on:
  schedule:
    # 02:00 UTC — evening in Colorado, after the day's setting is done.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      gym:
        description: KAYA gym slug (blank syncs every registered gym)
        default: ''
        required: false
  repository_dispatch:
    types: [kaya-sync]

concurrency:
  group: kaya-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Same graceful skip as the deploy jobs: no token, no write, but a visible warning.
      - name: Check for Cloudflare token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping catalog sync."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.present == 'true'
        run: npm ci
      - if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Sync catalogs
        if: steps.creds.outputs.present == 'true'
        # Slugs reach the script through env and as an argv element, never
        # interpolated into a shell command. A slug from either dispatch path
        # syncs just that gym; the cron passes none and syncs everything
        # registered.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GYM_SLUG: ${{ inputs.gym || github.event.client_payload.gym || '' }}
        run: |
          if [ -n "$GYM_SLUG" ]; then
            node scripts/kaya-sync-all.mjs --gym "$GYM_SLUG"
          else
            node scripts/kaya-sync-all.mjs
          fi

      # Kept so a bad sync can be diagnosed after the fact, and so the raw
      # response is available when KAYA changes a field.
      - name: Upload sync artifacts
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kaya-catalog
          path: catalog-sync/
          retention-days: 14
          if-no-files-found: ignore
